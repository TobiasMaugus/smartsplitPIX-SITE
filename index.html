<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pagamento Pix</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #F4F4F5;
      --card-bg: #FFFFFF;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --shadow: rgba(0, 0, 0, 0.1);
      --btn-toggle-bg: #F3F4F6;
      --btn-toggle-icon: #4B5563;
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #18181B;
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --shadow: rgba(0, 0, 0, 0.5);
      --btn-toggle-bg: #27272A;
      --btn-toggle-icon: #A1A1AA;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 🔥 100dvh resolve o problema de scroll fantasma no mobile */
      min-height: 100dvh; 
      padding: 16px;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Container Principal */
    .card {
      background: var(--card-bg);
      /* Ajuste nos espaçamentos internos para otimizar espaço vertical */
      padding: 36px 20px 24px; 
      border-radius: 24px;
      width: 100%;
      max-width: 380px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 32px var(--shadow);
      position: relative;
    }

    @media (min-width: 768px) {
      .card {
        max-width: 450px;
        padding: 40px;
      }
    }

    /* Botão de Tema dentro da Div */
    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background-color: var(--btn-toggle-bg);
      color: var(--btn-toggle-icon);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s;
      z-index: 2;
    }

    .logo-container {
      margin-top: 12px; /* Empurra a logo um pouco pra baixo do botão */
      margin-bottom: 8px; /* Menos espaço abaixo para caber na tela */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    #appLogo {
      /* 🔥 Logo com 300px cravados */
      width: 300px;
      max-width: 100%; /* Proteção para celulares extremamente estreitos */
      height: auto;
      max-height: 90px; /* Protege a altura para não empurrar os textos e gerar scroll */
      object-fit: contain;
    }

    h2 { margin: 0 0 4px 0; font-size: 20px; text-align: center; }
    .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; text-align: center; }
    
    .amount-display { font-size: 28px; font-weight: 700; margin-bottom: 12px; }

    .qrcode-box {
      background: #FFFFFF; 
      padding: 10px;
      border-radius: 16px;
      margin-bottom: 16px; 
      display: none; 
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    }

    .copy-btn {
      background-color: #10B981;
      color: #FFFFFF;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #success { 
      display: none; 
      color: #10B981; 
      margin-top: 12px; 
      font-weight: 600; 
      text-align: center;
      background-color: rgba(16, 185, 129, 0.15);
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }

    .error-msg {
      color: #EF4444;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <button id="themeToggle" class="theme-toggle"></button>

    <div class="logo-container">
      <img id="appLogo" src="group1l.svg" alt="Logo">
    </div>

    <h2>Pagamento via Pix</h2>
    <p class="subtitle">Escaneie o QR Code ou copie a chave</p>

    <div class="amount-display" id="amountDisplay"></div>

    <div class="qrcode-box" id="qrcodeBox">
      <div id="qrcode"></div>
    </div>

    <button id="copyBtn" class="copy-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      Copiar Código Pix
    </button>
    <div id="success">✅ Código copiado! Abra o app do seu banco.</div>
  </div>

  <script>
    // --- 1. Lógica do Tema ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const appLogo = document.getElementById('appLogo');
    
    const sunIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const moonIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    let theme = prefersDark.matches ? "dark" : "light";

    function apply(t) {
      document.documentElement.setAttribute("data-theme", t);
      appLogo.src = t === "dark" ? "group1d.svg" : "group1l.svg";
      themeToggleBtn.innerHTML = t === "dark" ? sunIcon : moonIcon;
    }
    apply(theme);
    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "light" ? "dark" : "light";
      apply(theme);
    });

    // --- 2. Lógica do PIX e QR Code ---
    const urlParams = new URLSearchParams(window.location.search);
    const pixCode = urlParams.get('codigo');
    
    const amountDisplay = document.getElementById('amountDisplay');
    const qrcodeBox = document.getElementById('qrcodeBox');
    const qrcodeElement = document.getElementById('qrcode');
    const copyBtn = document.getElementById('copyBtn');
    const successText = document.getElementById('success');

    function extractPixAmount(emvString) {
      let i = 0;
      while (i < emvString.length) {
        const id = emvString.substr(i, 2);
        const lenStr = emvString.substr(i + 2, 2);
        const len = parseInt(lenStr, 10);
        if (isNaN(len)) break;
        const value = emvString.substr(i + 4, len);
        if (id === '54') return parseFloat(value); 
        i += 4 + len;
      }
      return null;
    }

    if (!pixCode) {
      amountDisplay.innerHTML = '<div class="error-msg">Código Pix não encontrado no link. Gere o link novamente pelo aplicativo.</div>';
      copyBtn.style.display = 'none';
    } else {
      const amount = extractPixAmount(pixCode);
      if (amount) {
        amountDisplay.innerText = `R$ ${amount.toFixed(2).replace('.', ',')}`;
      }

      qrcodeBox.style.display = 'block';
      // Geração do QR Code
      new QRCode(qrcodeElement, {
        text: pixCode,
        width: 170, // Levemente reduzido para garantir que caiba verticalmente
        height: 170,
        colorDark : "#000000",
        colorLight : "#FFFFFF",
        correctLevel : QRCode.CorrectLevel.M
      });
    }

    // --- 3. Lógica de Copiar ---
    copyBtn.addEventListener('click', async () => {
      if (!pixCode) return;
      try {
        await navigator.clipboard.writeText(pixCode);
        copyBtn.style.display = 'none';
        successText.style.display = 'block';
      } catch (err) {
        prompt("Copie o código abaixo:", pixCode);
      }
    });
  </script>
</body>
</html>
