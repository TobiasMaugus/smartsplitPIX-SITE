<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pagamento Pix</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-color: #F4F4F5;
      --card-bg: #FFFFFF;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --shadow: rgba(0, 0, 0, 0.1);
      --btn-toggle-bg: #F3F4F6;
      --btn-toggle-icon: #4B5563;
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #18181B;
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --shadow: rgba(0, 0, 0, 0.5);
      --btn-toggle-bg: #27272A;
      --btn-toggle-icon: #A1A1AA;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Container Principal */
    .card {
      background: var(--card-bg);
      padding: 30px 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px; /* Padrão Mobile */
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 32px var(--shadow);
      position: relative;
    }

    /* 🔥 Media Query para Desktop (PC) */
    @media (min-width: 768px) {
      .card {
        max-width: 450px; /* Fica maior em PC */
        padding: 40px;
      }
    }

    /* Botão de Tema dentro da Div */
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background-color: var(--btn-toggle-bg);
      color: var(--btn-toggle-icon);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 🔥 Distância reduzida do logo para o teto e para o qrcode */
    .logo-container {
      margin-bottom: 12px; /* Reduzi bastante */
    }

    #appLogo {
      width: 300px; /* Reduzi o tamanho original para caber melhor */
      height: auto;
      object-fit: contain;
    }

    h2 { margin: 0 0 8px 0; font-size: 22px; }
    .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
    
    .amount-display { font-size: 32px; font-weight: 700; margin-bottom: 20px; }

    .qrcode-box {
      background: #FFFFFF;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 20px; /* Distância menor */
      display: none;
    }

    .copy-btn {
      background-color: #10B981;
      color: #FFFFFF;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
    }

    #success { display: none; color: #10B981; margin-top: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <button id="themeToggle" class="theme-toggle"></button>

    <div class="logo-container">
      <img id="appLogo" src="group1l.svg" alt="Logo">
    </div>

    <h2>Pagamento via Pix</h2>
    <p class="subtitle">Escaneie o QR Code ou copie a chave</p>

    <div class="amount-display" id="amountDisplay"></div>

    <div class="qrcode-box" id="qrcodeBox">
      <div id="qrcode"></div>
    </div>

    <button id="copyBtn" class="copy-btn">Copiar Código Pix</button>
    <div id="success">✅ Código copiado!</div>
  </div>

  <script>
    // [MANTER O RESTANTE DO SEU SCRIPT AQUI]
    // A lógica de aplicar tema e extrair valor permanece a mesma
    const themeToggleBtn = document.getElementById('themeToggle');
    const appLogo = document.getElementById('appLogo');
    const sunIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const moonIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    let theme = prefersDark.matches ? "dark" : "light";

    function apply(t) {
      document.documentElement.setAttribute("data-theme", t);
      appLogo.src = t === "dark" ? "group1d.svg" : "group1l.svg";
      themeToggleBtn.innerHTML = t === "dark" ? sunIcon : moonIcon;
    }
    apply(theme);
    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "light" ? "dark" : "light";
      apply(theme);
    });

    // ... (restante da lógica do Pix)
  </script>
</body>
</html>
